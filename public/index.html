<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Swipe Rewards</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c20 0%, #15102a 100%);
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .wallet-card {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            border-radius: 20px;
            padding: 25px;
            width: 90%;
            max-width: 350px;
            box-shadow: 0 10px 25px rgba(0, 114, 255, 0.3);
            text-align: center;
            margin-bottom: 30px;
        }
        .balance-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
            margin-bottom: 10px;
        }
        .balance-value {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .balance-usd {
            font-size: 16px;
            opacity: 0.9;
        }
        .swipe-container {
            position: relative;
            width: 90%;
            max-width: 350px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #1f1a3a;
            border: 2px solid #3d356d;
            border-radius: 25px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .card-title {
            font-size: 22px;
            font-weight: bold;
            color: #00ffcc;
        }
        .card-reward {
            background: rgba(0, 255, 204, 0.1);
            color: #00ffcc;
            padding: 8px 15px;
            border-radius: 50px;
            align-self: flex-start;
            font-weight: bold;
        }
        .btn-action {
            background: #00ffcc;
            color: #0f0c20;
            border: none;
            padding: 15px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
            width: 100%;
            box-sizing: border-box;
        }
        .btn-action:hover {
            background: #00ccaa;
        }
        .btn-action:disabled {
            background: #3d356d;
            color: #7f7f7f;
            cursor: not-allowed;
        }
        #status-log {
            margin-top: 15px;
            font-size: 13px;
            color: #00ffcc;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Crypto Swipe to Earn</h2>
    </div>

    <div class="wallet-card">
        <div class="balance-title">Баланс кошелька TON</div>
        <div id="balance-ton" class="balance-value">0.0000 TON</div>
        <div id="balance-usd" class="balance-usd">≈ \$0.00 USD</div>
    </div>

    <div class="swipe-container">
        <div class="card">
            <div>
                <div class="card-title">Тестовое задание Monlix</div>
                <p>Выполните микро-задачу, чтобы протестировать моментальное зачисление баланса в TON.</p>
            </div>
            <div class="card-reward">+0.2885 TON</div>
            <button id="offer-btn" class="btn-action">Выполнить оффер</button>
        </div>
    </div>
    
    <div id="status-log">Система: Готова к работе</div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) { tg.expand(); }

        const host = window.location.origin;
        const userId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : "777999"; 

        function logStatus(text) {
            document.getElementById('status-log').innerText = "Система: " + text;
        }

        async function fetchBalance() {
            try {
                const response = await fetch(`${host}/api/user-balance?userId=${userId}`);
                const data = await response.json();
                if (data && data.balance_ton !== undefined) {
                    const ton = parseFloat(data.balance_ton).toFixed(4);
                    const usd = (ton * 5.20).toFixed(2);
                    document.getElementById('balance-ton').innerText = `${ton} TON`;
                    document.getElementById('balance-usd').innerText = `≈ $${usd} USD`;
                }
            } catch (err) {
                console.error("Ошибка обновления баланса:", err);
            }
        }

        document.getElementById('offer-btn').addEventListener('click', async () => {
            const btn = document.getElementById('offer-btn');
            btn.innerText = "Отправка...";
            btn.disabled = true;
            logStatus("Отправка данных рекламодателя...");

            const timeout = setTimeout(() => {
                btn.innerText = "Выполнить оффер";
                btn.disabled = false;
                logStatus("Запрос обрабатывается в фоне...");
            }, 3000);

            try {
                const transId = `live_click_${Date.now()}`;
                const url = `${host}/api/postback?user_id=${userId}&amount=2.50&trans_id=${transId}&secret=any`;
                
                const response = await fetch(url);
                const text = await response.text();
                
                clearTimeout(timeout);
                logStatus("Успешно зачислено! Обновление...");
                
                btn.innerText = "Выполнить оффер";
                btn.disabled = false;
                
                await fetchBalance();
            } catch (err) {
                clearTimeout(timeout);
                logStatus("Ошибка сети.");
                btn.innerText = "Выполнить оффер";
                btn.disabled = false;
            }
        });

        fetchBalance();
    </script>
</body>
</html>
