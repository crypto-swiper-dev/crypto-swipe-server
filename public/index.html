<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Swipe Rewards</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c20 0%, #15102a 100%);
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .wallet-card {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            border-radius: 20px;
            padding: 25px;
            width: 90%;
            max-width: 350px;
            box-shadow: 0 10px 25px rgba(0, 114, 255, 0.3);
            text-align: center;
            margin-bottom: 30px;
        }
        .balance-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
            margin-bottom: 10px;
        }
        .balance-value {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .balance-usd {
            font-size: 16px;
            opacity: 0.9;
        }
        .swipe-container {
            position: relative;
            width: 90%;
            max-width: 350px;
            height: 380px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #1f1a3a;
            border: 2px solid #3d356d;
            border-radius: 25px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }
        .card-title {
            font-size: 22px;
            font-weight: bold;
            color: #00ffcc;
        }
        .card-reward {
            background: rgba(0, 255, 204, 0.1);
            color: #00ffcc;
            padding: 8px 15px;
            border-radius: 50px;
            align-self: flex-start;
            font-weight: bold;
        }
        .btn-action {
            background: #00ffcc;
            color: #0f0c20;
            border: none;
            padding: 15px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn-action:hover {
            background: #00ccaa;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Crypto Swipe to Earn</h2>
    </div>

    <div class="wallet-card">
        <div class="balance-title">Баланс кошелька TON</div>
        <div id="balance-ton" class="balance-value">0.0000 TON</div>
        <div id="balance-usd" class="balance-balance-usd">≈ \$0.00 USD</div>
    </div>

    <div class="swipe-container">
        <div class="card">
            <div>
                <div class="card-title">Тестовое задание Monlix</div>
                <p>Выполните микро-задачу внутри оффервола, чтобы мгновенно протестировать зачисление баланса в TON.</p>
            </div>
            <div class="card-reward">+0.2885 TON</div>
            <a href="#" id="offer-link" target="_blank" class="btn-action">Выполнить оффер</a>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();

        const userId = tg.initDataUnsafe?.user?.id || "777999"; 

        // Функция для динамического обновления баланса из нашей Supabase через Render бэкенд
        async function fetchBalance() {
            try {
                const response = await fetch(`/api/user-balance?userId=${userId}`);
                const data = await response.json();
                if (data && data.balance_ton !== undefined) {
                    const ton = parseFloat(data.balance_ton).toFixed(4);
                    const usd = (ton * 5.20).toFixed(2);
                    document.getElementById('balance-ton').innerText = `${ton} TON`;
                    document.getElementById('balance-usd').innerText = `≈ $${usd} USD`;
                }
            } catch (err) {
                console.error("Ошибка обновления баланса:", err);
            }
        }

        // Подставляем ID пользователя в ссылку оффера для Monlix
        document.getElementById('offer-link').href = `https://localhost:3000/api/postback?user_id=${userId}&amount=2.50&trans_id=live_click_${Date.now()}&secret=any`;

        // Запускаем проверку баланса при старте
        fetchBalance();
    </script>
</body>
</html>
