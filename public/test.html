<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Баланса</title>
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: sans-serif; background: #0f0c20; color: #fff; text-align: center; padding: 40px; }
        button { background: #00ffcc; color: #000; padding: 20px; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <h2>Проверка начисления TON</h2>
    <h1 id="view-balance">Загрузка...</h1>
    <br><br>
    <button id="click-btn">Кликнуть для начисления +0.2885 TON</button>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.expand();
        }
        
        const host = window.location.origin;
        const uid = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : "777999";

        async function load() {
            try {
                const res = await fetch(`${host}/api/user-balance?userId=${uid}`);
                const data = await res.json();
                
                // Выводим в консоль браузера для проверки, что прислал сервер
                console.log("Ответ сервера по балансу:", data);

                // Жесткая проверка: смотрим любое возможное поле баланса в ответе
                if (data && data.balance_ton !== undefined) {
                    document.getElementById('view-balance').innerText = `${parseFloat(data.balance_ton).toFixed(4)} TON`;
                } else if (data && data.balance !== undefined) {
                    document.getElementById('view-balance').innerText = `${parseFloat(data.balance).toFixed(4)} TON`;
                } else {
                    document.getElementById('view-balance').innerText = "Ошибка формата";
                }
            } catch(e) { 
                document.getElementById('view-balance').innerText = "Ошибка сети"; 
                console.error(e);
            }
        }

        document.getElementById('click-btn').addEventListener('click', async () => {
            try {
                const tid = `click_${Date.now()}`;
                const url = `${host}/api/postback?user_id=${uid}&amount=2.50&trans_id=${tid}&secret=any`;
                
                document.getElementById('click-btn').innerText = "Отправка...";
                
                const res = await fetch(url);
                const txt = await res.text();
                
                alert("Ответ сервера: " + txt);
                document.getElementById('click-btn').innerText = "Кликнуть для начисления +0.2885 TON";
                await load();
            } catch(e) { 
                alert("Ошибка запроса: " + e.message); 
                document.getElementById('click-btn').innerText = "Кликнуть для начисления +0.2885 TON";
            }
        });

        load();
    </script>
</body>
</html>
