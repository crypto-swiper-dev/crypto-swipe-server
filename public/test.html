<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Баланса</title>
    <!-- ИСПРАВЛЕНО: Правильный и полный адрес скрипта Telegram WebApp -->
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: sans-serif; background: #0f0c20; color: #fff; text-align: center; padding: 40px; }
        button { background: #00ffcc; color: #000; padding: 20px; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; }
        button:disabled { background: #3d356d; color: #7f7f7f; cursor: not-allowed; }
        #status-log { margin-top: 20px; padding: 15px; background: #1f1a3a; border-radius: 10px; font-size: 14px; color: #00ffcc; word-break: break-all; }
    </style>
</head>
<body>
    <h2>Проверка начисления TON</h2>
    <h1 id="view-balance">0.0000 TON</h1>
    <br><br>
    <button id="click-btn">Кликнуть для начисления +0.2885 TON</button>
    
    <!-- Информационное табло для вывода ответов сервера -->
    <div id="status-log">Статус системы: Готов к тесту</div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) { tg.expand(); }
        
        const host = window.location.origin;
        const uid = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : "777999";

        function logStatus(text, isError = false) {
            const logDiv = document.getElementById('status-log');
            logDiv.innerText = text;
            logDiv.style.color = isError ? "#ff4a4a" : "#00ffcc";
        }

        async function load() {
            try {
                const res = await fetch(`${host}/api/user-balance?userId=${uid}`);
                const data = await res.json();
                if (data && data.balance_ton !== undefined) {
                    document.getElementById('view-balance').innerText = `${parseFloat(data.balance_ton).toFixed(4)} TON`;
                }
            } catch(e) { 
                console.error("Ошибка чтения баланса:", e);
                logStatus("Ошибка загрузки баланса: " + e.message, true);
            }
        }

        document.getElementById('click-btn').addEventListener('click', async () => {
            const btn = document.getElementById('click-btn');
            btn.innerText = "Отправка...";
            btn.disabled = true;
            logStatus("Отправка тестового постбэка на сервер...");

            const timeout = setTimeout(() => {
                btn.innerText = "Кликнуть для начисления +0.2885 TON";
                btn.disabled = false;
                logStatus("Превышено время ожидания сервера (3 сек). Запрос отправлен в фон.", true);
            }, 3000);

            try {
                const tid = `click_${Date.now()}`;
                const url = `${host}/api/postback?user_id=${uid}&amount=2.50&trans_id=${tid}&secret=any`;
                
                const res = await fetch(url);
                const txt = await res.text();
                
                clearTimeout(timeout);
                logStatus("Ответ сервера: " + txt);
                
                btn.innerText = "Кликнуть для начисления +0.2885 TON";
                btn.disabled = false;
                await load();
            } catch(e) { 
                clearTimeout(timeout);
                logStatus("Ошибка сети: " + e.message, true);
                btn.innerText = "Кликнуть для начисления +0.2885 TON";
                btn.disabled = false;
            }
        });

        // Запуск проверки
        load();
    </script>
</body>
</html>
